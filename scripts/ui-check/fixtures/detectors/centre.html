<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centring fixture: GameFrame slots, input row, score line ink</title>
<!-- Selftest page for scripts/lib/game-shell.mjs measureInPage().centre and the `off-centre` / `loss-label` rules
     (ST-CENTRE, ST-LOSS-LABEL). The shell's class names (.stage-inner, .playing-wrap > .gf, .exit-link) with every
     slot filled at once: prompt, a narrow board card, an input row, an EndSequence score panel.
       default     everything centred: the input row's field is centred with its buttons beside it (not counted),
                   the score line's number box is exactly as wide as its number; a status row with both slots
                   (left/right by design, never measured); an off-centre board card at opacity 0.03 (skipped);
                   a "Board cleared!" label (a win's label).
       ?mode=bad   the input row's field grows next to its buttons (off centre to the left); the score line has
                   no label and its number box reserves 4 digits for "0", so the line's BOX is centred but its
                   INK sits right; the faint board card is fully visible (off centre to the left). -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
  main.page { padding: 16px; }
  section.stage-col { max-width: 560px; margin: 0 auto; }
  .stage-shell { border: 1px solid #444; border-radius: 12px; }
  .stage-inner { padding: 20px; }
  .playing-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .gf { position: relative; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .gf-status { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; font-size: 11px; }
  .gf-prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; text-align: center; }
  .gf-eyebrow { font-size: 11px; letter-spacing: 1.5px; }
  .gf-title { font-size: 19px; margin: 0; }
  .gf-board { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .card { width: 120px; height: 40px; background: #333; }
  .ghost { width: 60px; height: 20px; background: #555; align-self: flex-start; opacity: 0.03; }
  .gf-action { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .gf-inputrow { position: relative; display: flex; justify-content: center; gap: 10px; width: 100%; max-width: 440px; }
  .gf-inputrow > :first-child { width: 120px; }
  .gf-inputrow input { width: 100%; height: 40px; font: inherit; }
  .gf-inputrow-actions { position: absolute; left: calc(50% + 70px); top: 0; display: flex; gap: 6px; }
  .btn { min-height: 40px; font: inherit; }
  .endseq { width: 100%; display: flex; justify-content: center; }
  .endseq-slot { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .scorepanel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 420px; }
  .scorepanel-line { display: flex; align-items: baseline; gap: 9px; }
  .scorepanel-label { font-size: 0.9rem; font-weight: 600; color: rgb(47, 199, 98); }
  .scorepanel-pts { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scorepanel-num { display: inline-block; text-align: right; min-width: calc(var(--digits) * 1ch); }
  .scorepanel-actions { display: flex; gap: 10px; }
  .feedback-slot { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; pointer-events: none; }
  .exit-link { background: none; border: 0; color: #aaa; text-decoration: underline; height: 18px; }
  .exit-link.is-ended { visibility: hidden; }
  /* ?mode=bad */
  .bad .gf-inputrow { justify-content: flex-start; }
  .bad .gf-inputrow > :first-child { width: auto; flex: 1 1 auto; }
  .bad .gf-inputrow-actions { position: static; }
  .bad .ghost { opacity: 1; }
</style>
</head>
<body>
<main class="page">
  <section class="stage-col">
    <div class="stage-shell"><div class="stage-inner"><div>
      <div class="playing-wrap">
        <div class="gf">
          <div class="gf-status"><span class="gf-status-left">ROUND 1/5</span><span class="gf-status-right">SCORE 0</span></div>
          <div class="gf-prompt"><span class="gf-eyebrow">NAME THE TOP ANSWERS</span><h2 class="gf-title">Best shooter of all time?</h2></div>
          <div class="gf-board"><div class="card"></div><div class="ghost"></div></div>
          <div class="gf-action">
            <div class="gf-inputrow"><div class="field"><input aria-label="Answer"></div><div class="gf-inputrow-actions"><button class="btn">Confirm</button><button class="btn">Skip</button></div></div>
            <div class="endseq"><div class="endseq-slot"><div class="scorepanel">
              <div class="scorepanel-line" id="line"></div>
              <div class="scorepanel-actions"><button class="btn">Play again</button><button class="btn">Close game</button></div>
            </div></div></div>
          </div>
        </div>
        <div class="feedback-slot"></div>
        <button class="exit-link is-ended">Close game</button>
      </div>
    </div></div></div>
  </section>
</main>
<script>
  const bad = new URLSearchParams(location.search).get('mode') === 'bad';
  if (bad) document.body.classList.add('bad');
  document.getElementById('line').innerHTML = bad
    ? '<span class="scorepanel-pts tnum"><span class="scorepanel-num" style="--digits: 4">0</span>/300 pts</span>'
    : '<span class="scorepanel-label">Board cleared!</span><span class="scorepanel-pts tnum"><span class="scorepanel-num" style="--digits: 3">300</span>/300 pts</span>';
</script>
</body>
</html>
