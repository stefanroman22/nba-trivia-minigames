<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tap bad</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  main { padding: 16px; }
  .row { display: flex; align-items: center; gap: 2px; }
  .tiny { box-sizing: border-box; width: 16px; height: 16px; padding: 0; border: 1px solid #333; font-size: 10px; line-height: 1; }
  .big { box-sizing: border-box; width: 48px; height: 48px; }
</style>
</head>
<body>
<main class="page">
  <h1>Tap</h1>
  <!-- 16px button 2px from a 48px one: its 24px spacing circle hits the neighbour (WCAG 2.5.8 fails) -->
  <div class="row"><button class="tiny" aria-label="tiny">x</button><button class="big" type="button">OK</button></div>
</main>
</body>
</html>
