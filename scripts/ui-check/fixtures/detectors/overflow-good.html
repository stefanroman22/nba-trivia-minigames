<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overflow good</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  main { padding: 16px; }
  /* Same box, but it respects the viewport. */
  .wide { position: relative; width: 600px; max-width: 100%; height: 64px; background: #1d5e1d; color: #fff; }
  .far { position: absolute; right: 8px; top: 8px; width: 48px; height: 48px; }
  /* Wide content inside its own horizontal scroller is fine. */
  .scroller { overflow-x: auto; margin-top: 16px; }
  .scroller .track { width: 900px; height: 40px; background: linear-gradient(90deg, #ddd, #999); }
</style>
</head>
<body>
<main class="page">
  <h1>Overflow</h1>
  <div class="wide">wide box<button class="far" aria-label="far">x</button></div>
  <div class="scroller"><div class="track"></div></div>
</main>
</body>
</html>
