# gitleaks config shared by dev-ci.yml (tree scan on every push/PR to dev) and the security agent
# (.github/workflows/security.yml: full history weekly, the PR's added lines and commits on PRs to main). Tune false
# positives here: an allowlist entry needs a comment saying why, and is as narrow as possible (a line pattern, not a
# whole file). A leaked real secret is never allowlisted: revoke it, then purge it.
title = "nba-minigames gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Values that are public by design or are test fixtures"
# regexTarget "line": the patterns below match the whole line, so only these exact shapes are skipped
regexTarget = "line"
regexes = [
  # IndexNow key (scripts/seo/config.json): public by design, it is served as public/<key>.txt for search engines
  '''"indexNowKey"\s*:\s*"[0-9a-f]{32}"''',
  # the dummy UUID key of the IndexNow tests (scripts/seo/indexnow.test.mjs)
  '''a1b2c3d4-e5f6-7890-abcd-ef1234567890''',
]
# generated files whose integrity hashes look like secrets
paths = [
  '''(^|/)package-lock\.json$''',
]
