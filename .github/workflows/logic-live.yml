name: Logic live probes
# Logic Check's live suite (scripts/logic-check, LC-LIVE-01..07) against https://swishquest.com every 6 hours:
# read-only, guest, GET/HEAD only (the suite's request guard refuses anything else before it leaves the runner and
# run.mjs fails on any refused write), no browser, no stack, no accounts. Spec: docs/superpowers/specs/
# 2026-10-15-checks-prod-logic-design.md §7. Runs on main (the default branch), so the catalogue and origins the probes
# read are what the live site runs.
#   pass                         → nothing posted, state cleared
#   a failing check              → one Slack line (general = #pipeline); no card the first time it fails
#   the same check failing in two consecutive runs → Slack line + scripted triage (lib/live-triage.mjs, no agent) of
#                                  those checks only → findings (owner ci) → notion-push --checker logic --target main
#                                  (deduped by Source: a later failure comments on the open card instead of a new one)
#                                  → channel block-run: the card's services are blocked for UI check (spec §7)
#   infra (exit 2, or exit 1 with no failing check: guard mismatch, crash) → "logic-live infra: …" Slack line, no cards
# The failing ids per run (logic-live-state.json), the channel and the cards ledger live in the checks state store
# (branch checks-state, scripts/check-core/lib/state-store.mjs): pulled first, pushed last (3-way merge, fast-forward
# only), shared with the weekly run (checks-weekly.yml, or the PC's task), so a live block reaches the next UI check.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: logic-live
  cancel-in-progress: false
permissions:
  contents: write # the checks-state branch only
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Pull the state store
        env:
          CHECKS_STATE_TOKEN: ${{ github.token }}
        run: node scripts/check-core/state.mjs sync -m "checks-state: live probes (pull)"

      - name: Live probes (read-only)
        id: probe
        run: |
          RUN="$(date -u +%Y%m%d-%H%M)-logic"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          set +e
          UI_CHECK_RUN="$RUN" node scripts/logic-check/run.mjs --suite live --live
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Record the outcome
        id: state
        env:
          EXIT: ${{ steps.probe.outputs.exit }}
          RUN: ${{ steps.probe.outputs.run }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/logic-check/lib/live-triage.mjs state --exit "$EXIT" --file .ui-check/logic-live-state.json --run "$RUN" --url "$URL"

      - name: Slack line
        if: steps.state.outputs.action != 'none'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          LINE: ${{ steps.state.outputs.line }}
        run: node scripts/slack.mjs post-text general "$LINE"

      - name: Findings and Notion cards (second consecutive failure)
        if: always() && steps.state.outputs.action == 'cards'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RUN: ${{ steps.probe.outputs.run }}
          CARDS: ${{ steps.state.outputs.cards }}
        run: |
          node scripts/logic-check/lib/live-triage.mjs triage --run "$RUN" --ids "$CARDS"
          node scripts/check-core/notion-push.mjs --run "$RUN" --checker logic --target main
          node scripts/check-core/lib/channel.mjs block-run --run "$RUN"

      - name: Push the state store
        if: always() && steps.state.outcome == 'success'
        env:
          CHECKS_STATE_TOKEN: ${{ github.token }}
        run: node scripts/check-core/state.mjs sync -m "checks-state: live probes ${{ steps.probe.outputs.run }}"

      - name: Digest
        if: always()
        env:
          RUN: ${{ steps.probe.outputs.run }}
        run: cat ".ui-check/runs/$RUN/digest.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail the job when the probes did not pass
        if: steps.probe.outputs.exit != '0'
        run: exit 1
