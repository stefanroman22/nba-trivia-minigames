name: Doctor research
# The doctor's weekly research (docs/superpowers/specs/2026-10-12-question-factory-design.md §4.9).
# The nightly scan (factory-nightly.yml) quarantines or queues questions with player signals; this
# finds out why, one case per question:
#   export   (has the DB secret)  quarantined + queued questions -> doctor/case-NNN.json (view, our rows,
#                                 wrong-answer clusters, report notes, signals)
#   research (NO DB secret)       Claude (Max-plan OAuth token) researches each case on the four approved
#                                 sites only (Claude Code permissions) and writes one verdict
#   apply    (has the DB secret)  re-validates every verdict in code (FactoryRun kind "doctor"): data
#                                 corrections are only proposed (the Checker that confirmed them was
#                                 removed 2026-10-30); released questions go back to pending
# Instructions for the agent: .claude/skills/nba-question-writer/references/doctor.md.
on:
  schedule:
    - cron: "0 3 * * 2"   # Tuesday 03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "most cases to research in this run"
        required: false
        default: "40"
        type: string
      model:
        description: "Doctor model"
        required: false
        default: opus
        type: choice
        options:
          - opus
          - sonnet
          - fable
concurrency:
  group: doctor-research
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.export.outputs.cases }}
      count: ${{ steps.export.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt
      - name: Export cases
        id: export
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          LIMIT: ${{ inputs.limit || '40' }}
        run: python manage.py export_doctor_cases --out "$GITHUB_WORKSPACE/doctor" --limit "$LIMIT"
      - name: Keep the cases for the doctor
        if: steps.export.outputs.count != '0'
        uses: actions/upload-artifact@v6
        with:
          name: doctor-cases
          path: doctor/
          # The cases carry players' report notes (docs/legal/RECORD_OF_PROCESSING.md, Anthropic).
          retention-days: 1

  research:
    needs: export
    if: needs.export.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No database secret anywhere in this job (spec §3 principle 7).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(needs.export.outputs.cases) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: doctor-cases
          path: doctor
      - name: Doctor agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scheduled runs are started by github-actions, which the action refuses unless allowed.
          allowed_bots: "*"
          # The job's own read-only token. Without it the action exchanges an OIDC token with
          # Anthropic's GitHub App, and that exchange refuses scheduled runs ("User does not have
          # write access": a cron has no triggering user). This step needs no GitHub write at all;
          # it only writes a local file.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the doctor. Read .claude/skills/nba-question-writer/references/doctor.md and follow it exactly.
            Input case: doctor/case-${{ matrix.case }}.json
            Write your verdict to doctor/verdict-${{ matrix.case }}.json and write no other file.
          claude_args: >-
            --model ${{ inputs.model || 'opus' }}
            --max-turns 250
            --allowedTools "Read,Write,WebFetch(domain:www.basketball-reference.com),WebFetch(domain:www.nba.com),WebFetch(domain:en.wikipedia.org),WebFetch(domain:www.espn.com)"
            --disallowedTools "Bash,Edit,MultiEdit,WebSearch,Agent,Task,NotebookEdit"
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doctor-verdict-${{ matrix.case }}
          path: doctor/verdict-${{ matrix.case }}.json
          if-no-files-found: warn
          retention-days: 1

  apply:
    needs: [export, research]
    if: always() && needs.export.result == 'success' && needs.export.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt
      - name: Collect verdicts
        uses: actions/download-artifact@v6
        with:
          pattern: doctor-verdict-*
          path: verdicts
          merge-multiple: true
      - name: Apply verdicts
        id: apply
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: python manage.py apply_doctor_verdicts "$GITHUB_WORKSPACE/verdicts" --trigger "$TRIGGER"
      # A retired live question must leave production. Only from the default branch.
      - name: Publish the doctor's changes
        if: steps.apply.outputs.changed != '0' && steps.apply.outputs.changed != '' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-game-data.yml --ref "${{ github.ref_name }}" \
            -f games=career-path,who-are-ya,tictactoe,contexto,fan-favorites,who-would-win -f target=vercel -f dry_run=false
          echo "Doctor retired ${{ steps.apply.outputs.changed }} live question(s); publish dispatched." >> "$GITHUB_STEP_SUMMARY"
