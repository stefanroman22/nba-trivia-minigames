name: Dev CI and Promote

# Runs lint/security on pushes to dev and on PRs targeting dev. Promotion to
# main is NOT part of that automatic run for anyone (human, Claude, or the
# team pipeline) — it only runs when this workflow is dispatched manually
# ("Run workflow" in the Actions tab, or `gh workflow run dev-ci.yml`), so
# dev is always the default destination and production is an explicit step.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the WORKING TREE (current committed files) for exposed secrets/keys/tokens.
      # --no-git avoids failing on secrets that only exist in old history (use a history
      # purge / .gitleaks.toml allowlist for those). Runs the gitleaks binary via Docker
      # so there is no marketplace-action license gating on a personal repo.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --redact --verbose --exit-code 1

  promote:
    name: Promote dev to main
    needs: [lint, security]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge dev into main and push
        run: |
          set -euo pipefail
          git fetch origin main dev
          git checkout -B main origin/main
          if git merge --ff-only origin/dev; then
            echo "Fast-forwarded main to dev."
          else
            echo "Fast-forward not possible; creating a merge commit."
            git merge --no-ff origin/dev -m "Auto-merge dev into main [skip ci]"
          fi
          git push origin main
      # A GITHUB_TOKEN push does not fire other on:push workflows (GitHub's anti-recursion
      # behavior), so main-sync.yml never sees this push. Do the same QA -> Done marking
      # inline instead of relying on that trigger. main-sync.yml stays correct for the OTHER
      # way main can move: an agent explicitly pushing main with its own (non-GITHUB_TOKEN)
      # credentials, which IS a normal push event.
      - name: Promote QA cards whose commit is on main
        run: |
          set -euo pipefail
          node scripts/notion.mjs list-qa | jq -r '.[] | "\(.id) \(.commit)"' | while read -r id sha; do
            [ -z "$sha" ] && { echo "skip $id: no Commit"; continue; }
            if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              node scripts/notion.mjs mark-done "$id" && echo "done: $id ($sha)"
            else
              echo "not on main yet: $id ($sha)"
            fi
          done
