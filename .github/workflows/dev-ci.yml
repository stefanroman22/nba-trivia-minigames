name: Dev CI and Promote

# Runs on pushes to dev and on PRs targeting dev: lint + secret scan only. Promotion to
# main is a human-merged PR (dev → main), see docs/team/PIPELINE.md §10.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the WORKING TREE (current committed files) for exposed secrets/keys/tokens.
      # --no-git avoids failing on secrets that only exist in old history (use a history
      # purge / .gitleaks.toml allowlist for those). Runs the gitleaks binary via Docker
      # so there is no marketplace-action license gating on a personal repo.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --redact --verbose --exit-code 1
