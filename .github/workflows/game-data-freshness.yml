name: Game data freshness
# Daily read-only check: builds every game's rows from the DB without writing to it
# (manage.py publish_game_data_v3 --check-only), diffs them against the live manifest
# on the data host, and posts ONE Slack message to #agent-backend naming any game whose
# data changed but wasn't published. Nothing stale (or the check can't tell): no message.
# Design: docs/team/designs/2026-10-02-independent-game-data-publishing.md (phase 5).
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, after the PC's overnight NBA sync
  workflow_dispatch:
concurrency:
  group: game-data-freshness
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_PUBLIC_BASE: ${{ vars.DATA_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt
      - name: Check freshness (read-only)
        id: check
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: python manage.py publish_game_data_v3 --check-only --report "$GITHUB_WORKSPACE/build/freshness-report.json"

      - name: Warn when the check could not tell
        if: steps.check.outputs.result == 'unknown'
        run: echo "::warning::Freshness check result is unknown (live manifest unreachable or a game failed to build); see the job summary."

      - name: Post stale games to Slack
        if: steps.check.outputs.stale != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          STALE: ${{ steps.check.outputs.stale }}
          LIVE_VERSION: ${{ steps.check.outputs.live_version }}
          PUBLISH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish-game-data.yml
        run: |
          set -euo pipefail
          games="${STALE//,/, }"
          {
            echo ":warning: *Game data not published:* ${games}"
            echo "The database has changes these games don't show yet (live data version ${LIVE_VERSION:-unknown})."
            echo "Publish: <${PUBLISH_URL}|Publish game data> → Run workflow, games \`${STALE}\` (or empty for all), dry_run unticked."
          } | node scripts/slack.mjs post-text backend -
