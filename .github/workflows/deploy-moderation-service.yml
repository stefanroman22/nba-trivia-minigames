name: Deploy moderation service
# The photo-moderation classifier (moderation_service/, a separate tiny Vercel Python project
# called server-to-server by Django). The ONNX model is not committed: this workflow fetches
# it from Hugging Face, verifies its SHA-256 against moderation_service/model/model.sha256,
# runs the false-positive evaluation on the committed synthetic benign set with the real
# model, and (manual run with deploy=true only) deploys the folder with the Vercel CLI and
# smoke-tests the live endpoint.
# Manual only (workflow_dispatch): with deploy=false it is an evaluation-only run.
# While model.sha256 is UNPINNED the run prints the hash and fails before anything deploys:
# commit that hash (owner step 0, docs/DEPLOYMENT.md).
# Design: docs/team/designs/2026-10-07-photo-moderation-with-a-small.md.
# Never touches the website or backend deploys.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "deploy to the nba-minigames-moderation Vercel project after the evaluation passes"
        required: true
        default: false
        type: boolean
concurrency:
  group: deploy-moderation-service
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_FILE: moderation_service/model/image-safety-classifier-xs.onnx
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: moderation_service/requirements.txt
      - name: Install
        run: pip install -r moderation_service/requirements.txt huggingface_hub

      - name: Fetch model
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, shutil, sys
          from huggingface_hub import snapshot_download

          snap = snapshot_download(repo_id="OwenElliott/image-safety-classifier-xs", allow_patterns=["*.onnx"])
          found = glob.glob(os.path.join(snap, "**", "*.onnx"), recursive=True)
          if len(found) != 1:
              print(f"::error::expected exactly one .onnx file in the model repo, found {len(found)}")
              sys.exit(1)
          shutil.copyfile(found[0], os.environ["MODEL_FILE"])
          PY
          ls -l "$MODEL_FILE"

      - name: Check model checksum pin
        shell: bash
        run: |
          actual=$(sha256sum "$MODEL_FILE" | cut -d' ' -f1)
          pinned=$(awk 'NF { print $1; exit }' moderation_service/model/model.sha256)
          echo "Model SHA-256: $actual"
          {
            echo "### Model checksum"
            echo
            echo "\`$actual\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$pinned" ] || [ "$pinned" = "UNPINNED" ]; then
            echo "::error::moderation_service/model/model.sha256 is UNPINNED. Confirm the model license, then commit this hash to that file: $actual"
            exit 1
          fi
          if [ "$pinned" != "$actual" ]; then
            echo "::error::Model checksum mismatch: pinned $pinned, fetched $actual. Refusing to evaluate or deploy."
            exit 1
          fi

      - name: Evaluate (false-positive check on the committed benign set)
        shell: bash
        run: |
          python moderation_service/eval/run_eval.py \
            --dir moderation_service/eval \
            --max-false-block 0 \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Measure service bundle size
        shell: bash
        run: |
          site=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          {
            echo "### Moderation service bundle size"
            echo
            echo '```'
            du -sh "$MODEL_FILE"
            for d in onnxruntime numpy numpy.libs PIL pillow.libs; do
              [ -e "$site/$d" ] && du -sh "$site/$d"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Vercel secrets
        if: inputs.deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MODERATION_PROJECT_ID }}
          MODERATION_SHARED_SECRET: ${{ secrets.MODERATION_SHARED_SECRET }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_MODERATION_PROJECT_ID)
          [ -n "$MODERATION_SHARED_SECRET" ] || missing+=(MODERATION_SHARED_SECRET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets for the moderation deploy: ${missing[*]} (see docs/DEPLOYMENT.md, Moderation service)"
            exit 1
          fi

      - name: Deploy to Vercel
        id: deploy
        if: inputs.deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MODERATION_PROJECT_ID }}
        # A separate Vercel project from the website and the Django API. The model file is
        # uploaded from the workspace (moderation_service/.vercelignore drops eval/ and tests/ only).
        run: |
          url=$(npx --yes vercel@latest deploy moderation_service --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: inputs.deploy
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          MODERATION_SHARED_SECRET: ${{ secrets.MODERATION_SHARED_SECRET }}
        # The secret is read from the environment inside Python, never put on a command line.
        run: |
          python - <<'PY'
          import io, json, os, sys, time, urllib.error, urllib.request
          from PIL import Image

          endpoint = os.environ["DEPLOY_URL"].rstrip("/") + "/api/classify"

          def call(req):
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          # 1. health probe (no secret); retry while the fresh deployment warms up.
          health = None
          for attempt in range(6):
              status, body = call(urllib.request.Request(endpoint))
              try:
                  health = json.loads(body)
              except ValueError:
                  health = None
              if status == 200 and isinstance(health, dict) and health.get("model_loaded") is True:
                  break
              time.sleep(5)
          else:
              print(f"::error::health probe failed (HTTP {status}); if this is a Vercel login page, turn off Deployment Protection for the moderation project. Body is not an expected health JSON.")
              sys.exit(1)
          print("health:", health)

          # 2. classify a benign sample, re-encoded as JPEG like the Django upload path.
          buf = io.BytesIO()
          Image.open("moderation_service/eval/benign/sports_01.png").convert("RGB").save(buf, format="JPEG", quality=82)
          req = urllib.request.Request(
              endpoint,
              data=buf.getvalue(),
              method="POST",
              headers={"Content-Type": "image/jpeg", "X-Moderation-Key": os.environ["MODERATION_SHARED_SECRET"]},
          )
          status, body = call(req)
          if status != 200:
              print(f"::error::classify returned HTTP {status}")
              sys.exit(1)
          scores = json.loads(body)
          print({k: scores.get(k) for k in ("nsfw", "nsfl", "sfw", "model", "version")})
          risk = max(scores["nsfw"], scores["nsfl"])
          if scores["sfw"] < 0.5 or risk >= 0.85:
              print(f"::error::smoke test failed: benign sample scored sfw={scores['sfw']:.3f}, max(nsfw,nsfl)={risk:.3f}")
              sys.exit(1)

          # 3. a wrong key must be refused.
          bad = urllib.request.Request(endpoint, data=buf.getvalue(), method="POST", headers={"Content-Type": "image/jpeg", "X-Moderation-Key": "wrong"})
          status, _ = call(bad)
          if status != 401:
              print(f"::error::wrong key was answered with HTTP {status}, expected 401")
              sys.exit(1)
          print("smoke test passed")
          PY
