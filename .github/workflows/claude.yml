name: Claude Code

# Mention-driven: comment "@claude ..." on a PR or issue to run the agent.
# The active engine profile (subagent model + reasoning effort) is read from
# .claude/settings.json so CI honors the same switch as local/web/routines.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

jobs:
  claude:
    if: (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve engine profile from .claude/settings.json
        id: profile
        run: |
          MAIN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8')).model || 'opus')")
          MODEL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8')).env?.CLAUDE_CODE_SUBAGENT_MODEL || 'sonnet')")
          EFFORT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8')).env?.CLAUDE_CODE_EFFORT_LEVEL || 'high')")
          echo "main_model=$MAIN" >> "$GITHUB_OUTPUT"
          echo "subagent_model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "effort=$EFFORT" >> "$GITHUB_OUTPUT"
          echo "Active engine: main=$MAIN subagent=$MODEL effort=$EFFORT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ steps.profile.outputs.main_model }}
        env:
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.profile.outputs.subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.profile.outputs.effort }}

  # Trust model: team/* branches are pushed only by the owner's automation pipeline.
  cto-review:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'team/')
    runs-on: ubuntu-latest
    concurrency:
      group: cto-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CTO review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/cto-review ${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "Bash,Read,Grep,Glob,Write"'

      - name: Upload verdict artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cto-verdict
          path: cto-verdict.json

  cto-act:
    needs: cto-review
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'team/')
    runs-on: ubuntu-latest
    concurrency:
      group: cto-act-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verdict artifact
        uses: actions/download-artifact@v4
        with:
          name: cto-verdict

      - name: Extract Notion task id
        id: meta
        run: |
          BODY=$(gh pr view "$PR" --json body -q .body)
          echo "notion_task=$(echo "$BODY" | grep -oP 'Notion-Task: \K\S+' || true)" >> "$GITHUB_OUTPUT"

      - name: Protected paths check
        id: protected
        run: |
          FILES=$(gh pr diff "$PR" --name-only)
          if echo "$FILES" | grep -E '^\.github/workflows/|^vercel\.json$|^package(-lock)?\.json$|^backend/requirements\.txt$'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Act on verdict
        run: |
          VERDICT=$(jq -r .verdict cto-verdict.json)
          NOTION_TASK="${{ steps.meta.outputs.notion_task }}"
          if [ "${{ steps.protected.outputs.hit }}" = "true" ]; then
            gh pr edit "$PR" --add-label "needs-human-approval"
            if [ -n "$NOTION_TASK" ]; then
              ( node scripts/notion.mjs set-status "$NOTION_TASK" "Blocked-approval" \
                && node scripts/notion.mjs comment "$NOTION_TASK" "PR touches protected paths — needs your tap: $(gh pr view $PR --json url -q .url)" --mention ) \
                || echo "notion update failed (non-fatal)"
            fi
            exit 0
          fi
          if [ "$VERDICT" = "APPROVE" ]; then
            # --required only: this cto job is itself a check on the PR, so watching ALL
            # checks would deadlock waiting on ourselves. dev-ci should be marked required
            # on dev PRs in branch protection; if no required checks exist this returns fast.
            gh pr checks "$PR" --required --watch || { echo "required checks failed"; VERDICT="REQUEST_CHANGES"; }
          fi
          if [ "$VERDICT" = "APPROVE" ]; then
            gh pr merge "$PR" --squash --delete-branch
            if [ -n "$NOTION_TASK" ]; then
              ( node scripts/notion.mjs set-status "$NOTION_TASK" "Done" \
                && node scripts/notion.mjs comment "$NOTION_TASK" "Merged to dev 🎉 $(gh pr view $PR --json url -q .url)" --mention ) \
                || echo "notion update failed (non-fatal)"
            fi
          else
            gh pr edit "$PR" --add-label "cto-changes-requested"
            if [ -n "$NOTION_TASK" ]; then
              node scripts/notion.mjs comment "$NOTION_TASK" "CTO requested changes — next local run will fix. $(gh pr view $PR --json url -q .url)" \
                || echo "notion update failed (non-fatal)"
            fi
          fi
