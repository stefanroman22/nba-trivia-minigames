name: Publish game data
# Builds the manifest-v3 game-data folder from the DB (manage.py publish_game_data_v3),
# uploads only when something changed, then verifies the live files byte for byte.
# Question games (career-path, who-are-ya, tictactoe, contexto) first run the question
# maintenance (re-materialize, retire, top up, minimum gate) in the same DB transaction as
# the build; this supersedes maintain-questions.yml for them.
# Design: docs/team/designs/2026-10-02-independent-game-data-publishing.md.
# Never touches the website or backend deploys, and never calls stats.nba.com.
# A dry run passes --no-commit: the folder is built (and uploaded as an artifact) but every
# DB write of the run (question maintenance, Fan Favorites re-rank) is rolled back, except the
# factory journal (FactoryRun / FactoryEvent), which records the dry run itself.
# Weekly schedule (question factory supply run, docs/superpowers/specs/2026-10-12-question-factory-design.md):
# every Saturday 00:00 Paris time, the four question games only, for real. New and changed
# questions are staged as pending and go live only after the Checker (question-checker.yml)
# approves them, which then dispatches this workflow (with maintenance, so changed live
# questions are staged, never shipped unchecked). Retired questions leave production in the
# run itself. Pool games still publish by hand after a data sync.
on:
  schedule:
    # Cron is UTC only. Saturday 00:00 in Paris is Friday 23:00 UTC in winter (CET) and Friday
    # 22:00 UTC in summer (CEST); both slots fire and the gate job lets through only the one
    # that is midnight in Paris that week.
    - cron: "0 22 * * 5"
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      games:
        description: "comma-separated games (empty = all): playoff,name-logo,mvps,starting-five,fan-favorites,all-players,career-path,who-are-ya,tictactoe,contexto,question-names"
        required: false
        default: ""
        type: string
      target:
        description: "data host"
        required: true
        default: vercel
        type: choice
        options:
          - vercel
          - r2
      dry_run:
        description: "build and diff only; upload the folder as an artifact"
        required: true
        default: true
        type: boolean
      skip_maintain:
        description: "publish the current active questions without maintenance (live questions whose content changed since they were checked are left out)"
        required: false
        default: false
        type: boolean
      trigger:
        description: "what started this run, for the factory journal (manual | data-refresh)"
        required: false
        default: manual
        type: string
concurrency:
  group: publish-game-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SLOT: ${{ github.event.schedule }}
        run: |
          # Decided by the slot that fired, not the clock, so a delayed scheduled run still counts.
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/Paris date +%z)   # +0100 in winter (CET), +0200 in summer (CEST)
          if [ "$offset" != "+0100" ] && [ "$offset" != "+0200" ]; then
            echo "::error::Unexpected Paris UTC offset '$offset' (no tz database?); refusing to guess"
            exit 1
          fi
          if { [ "$SLOT" = "0 23 * * 5" ] && [ "$offset" = "+0100" ]; } || { [ "$SLOT" = "0 22 * * 5" ] && [ "$offset" = "+0200" ]; }; then
            go=true
          else
            go=false
          fi
          echo "Paris UTC offset $offset, slot '$SLOT': go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repo variable; unset on the very first run (everything is then "new").
      DATA_PUBLIC_BASE: ${{ vars.DATA_PUBLIC_BASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt
      - name: Build game data
        id: build
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          # A scheduled run has no inputs: it is the weekly supply run of the four question games.
          GAMES: ${{ github.event_name == 'schedule' && 'career-path,who-are-ya,tictactoe,contexto' || inputs.games }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_MAINTAIN: ${{ inputs.skip_maintain }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
        run: |
          extra=()
          if [ "$DRY_RUN" = "true" ]; then extra+=(--no-commit); fi
          if [ "$SKIP_MAINTAIN" = "true" ]; then extra+=(--skip-maintain); fi
          python manage.py publish_game_data_v3 --games "$GAMES" --trigger "$TRIGGER" "${extra[@]}" \
            --out "$GITHUB_WORKSPACE/build/game-data" \
            --report "$GITHUB_WORKSPACE/build/game-data-report.json"

      - name: Upload dry-run folder
        if: steps.build.outputs.result == 'publish' && inputs.dry_run
        uses: actions/upload-artifact@v6
        with:
          name: game-data-${{ steps.build.outputs.version }}
          path: build/
          include-hidden-files: true

      - name: Check Vercel secrets
        if: steps.build.outputs.result == 'publish' && !inputs.dry_run && (inputs.target || 'vercel') == 'vercel'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DATA_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_DATA_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets for the Vercel data target: ${missing[*]} (see phase 0 of the design doc)"
            exit 1
          fi

      - name: Deploy to Vercel
        id: deploy
        if: steps.build.outputs.result == 'publish' && !inputs.dry_run && (inputs.target || 'vercel') == 'vercel'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DATA_PROJECT_ID }}
        # A static folder: no package.json, no build step. Vercel uploads only
        # files it doesn't already have (content-addressed names never change).
        run: |
          url=$(npx --yes vercel@latest deploy build/game-data --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.build.outputs.result == 'publish' && !inputs.dry_run && inputs.target == 'r2'
        run: |
          echo "::error::R2 target not configured yet (owner decision)"
          exit 1

      - name: Verify live data
        if: steps.build.outputs.result == 'publish' && !inputs.dry_run
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          base="${DATA_PUBLIC_BASE:-$DEPLOY_URL}"
          if [ -z "$DATA_PUBLIC_BASE" ]; then
            echo "::warning::vars.DATA_PUBLIC_BASE is not set; verifying against the deployment URL $DEPLOY_URL. Set it to the data host's production URL."
          fi
          python backend/scripts/verify_game_data.py --base "$base" --report build/game-data-report.json

      - name: Fail if a game was held back
        if: steps.build.outputs.held_back != ''
        shell: bash
        env:
          HELD_BACK: ${{ steps.build.outputs.held_back }}
        run: |
          echo "::error::Held back at their last published version (below minimum): $HELD_BACK. Every other game was published."
          exit 1
