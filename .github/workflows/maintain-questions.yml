name: Maintain Questions
# SUPERSEDED for the public question games (career-path, who-are-ya, tictactoe, contexto):
# "Publish game data" (publish-game-data.yml) now runs their maintenance and publishes them to
# the manifest-v3 data host. Manual only (the daily schedule is removed; the workflow was
# disabled in GitHub). Kept because the hidden games superdraft and imposter are still read
# from this Supabase Storage snapshot until they return; running it also refreshes the old
# snapshot the site and relay fall back to. Retirement steps: phase 6 of
# docs/team/designs/2026-10-02-independent-game-data-publishing.md.
#
# Re-materializes, prunes, tops up and publishes the pre-generated game questions.
# Reads the player dataset from Supabase Storage (never stats.nba.com).
on:
  workflow_dispatch:
    inputs:
      games:
        description: "comma-separated slugs (empty = all)"
        required: false
        default: ""
concurrency:
  group: maintain-questions
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      QUESTIONS_PUBLIC_BASE: ${{ secrets.QUESTIONS_PUBLIC_BASE }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt -r backend/requirements-publish.txt
      - name: Maintain and publish
        working-directory: backend
        shell: bash
        run: python manage.py maintain_questions --games "${{ inputs.games }}" | tee ../maintain-questions.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maintain-questions-log
          path: maintain-questions.log
