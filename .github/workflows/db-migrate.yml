name: DB migrate
# Applies Django migrations to the production database from the cloud, so a schema change
# never needs the owner's PC. Runs on manual dispatch (from the default branch) or on a push
# to an `ops/migrate-**` branch (so it can run before promotion, with that branch's code).
# `migrate` is additive and idempotent: already-applied migrations are skipped.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "app label to migrate (empty = all)"
        required: false
        default: ""
        type: string
      plan_only:
        description: "show the plan (migrate --plan) and stop"
        required: false
        default: false
        type: boolean
  push:
    branches: ["ops/migrate-**"]
concurrency:
  group: db-migrate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      APP: ${{ inputs.app }}
      PLAN_ONLY: ${{ inputs.plan_only }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Show the plan
        run: python manage.py showmigrations --plan | grep -v "^\[X\]" || true
      - name: Apply migrations
        if: env.PLAN_ONLY != 'true'
        run: |
          set -euo pipefail
          if [ -n "$APP" ]; then python manage.py migrate --noinput "$APP"; else python manage.py migrate --noinput; fi
      - name: Unapplied after the run
        if: env.PLAN_ONLY != 'true'
        run: python manage.py showmigrations --plan | grep -v "^\[X\]" || echo "all applied"
