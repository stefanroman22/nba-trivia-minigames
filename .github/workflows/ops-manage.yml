name: Ops command
# Runs ONE allow-listed Django management command against the production database from a
# GitHub runner, so a one-off operation never needs the owner's PC. Manual dispatch (from the
# default branch) or a push to `ops/run-<command>-**` (so it can run before promotion with
# that branch's code). Anything outside the allow-list is refused. A push run reads the
# command's arguments from `backend/ops/args/<command>.txt` on that branch when the file
# exists (one line, whitespace-separated, no shell expansion). A manual dispatch takes arguments
# only for tictactoe_difficulty and question_writer, through the `args` input: same splitting, characters limited to
# [A-Za-z0-9_=.,:-] and spaces, checked before Django starts; `args` on any other command is refused.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "management command to run"
        required: true
        type: choice
        options:
          - import_editorial_seeds
          - factory_health
          - showmigrations
          - factory_supply
          - apply_editorial_proposals
          - seed_who_would_win_votes
          - recount_progression
          - sync_leaderboard
          - tictactoe_difficulty
          - question_writer
      args:
        description: "arguments, tictactoe_difficulty / question_writer only (e.g. --generate-easy 1200 --seed 2026, or export --game tictactoe); letters, digits, _=.,:- and spaces"
        required: false
        default: ""
        type: string
  push:
    branches: ["ops/run-**"]
concurrency:
  group: ops-manage
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      # Only sync_leaderboard needs it; empty until the owner adds the REDIS_URL secret.
      REDIS_URL: ${{ secrets.REDIS_URL }}
      INPUT_COMMAND: ${{ inputs.command }}
      # Read from the environment only, never interpolated into a script (shell injection).
      INPUT_ARGS: ${{ inputs.args }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pick the command
        id: pick
        run: |
          set -euo pipefail
          cmd="$INPUT_COMMAND"
          if [ -z "$cmd" ]; then
            # ops/run-<command>-<anything>  ->  <command>
            cmd=$(printf '%s' "$REF_NAME" | sed -E 's#^ops/run-([a-z_]+)(-.*)?$#\1#')
          fi
          case "$cmd" in
            import_editorial_seeds|factory_health|showmigrations|factory_supply|apply_editorial_proposals|seed_who_would_win_votes|recount_progression|sync_leaderboard|tictactoe_difficulty|question_writer) ;;
            *) echo "::error::command '$cmd' is not allow-listed"; exit 1 ;;
          esac
          if [ -n "$INPUT_ARGS" ]; then
            if [ "$cmd" != "tictactoe_difficulty" ] && [ "$cmd" != "question_writer" ]; then
              echo "::error::args are accepted only for tictactoe_difficulty and question_writer, not '$cmd'"; exit 1
            fi
            export LC_ALL=C
            allowed='^[A-Za-z0-9_=.,: -]*$'
            if ! [[ "$INPUT_ARGS" =~ $allowed ]]; then
              echo "::error::args may only contain letters, digits, _=.,:- and spaces"; exit 1
            fi
            # Django's own --settings / --pythonpath (and their argparse abbreviations) would load other code.
            read -r -a words <<< "$INPUT_ARGS"
            for w in "${words[@]}"; do
              case "$w" in --set*|--p*) echo "::error::args may not set '$w'"; exit 1 ;; esac
            done
          fi
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          echo "running: $cmd"
      - name: Run it
        env:
          CMD: ${{ steps.pick.outputs.cmd }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INPUT_ARGS" ]; then
            # Validated by "Pick the command"; split on whitespace, no expansion.
            read -r -a args <<< "$INPUT_ARGS"
          elif [ -f "ops/args/$CMD.txt" ]; then
            read -r -a args < "ops/args/$CMD.txt"
          fi
          echo "running: $CMD ${args[*]:-}"
          python manage.py "$CMD" "${args[@]}"
      # question_writer export / apply write their JSON under backend/ops/out: keep it for the writer.
      - name: Keep the command's output files
        if: always() && hashFiles('backend/ops/out/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ops-out
          path: backend/ops/out/
          retention-days: 7
