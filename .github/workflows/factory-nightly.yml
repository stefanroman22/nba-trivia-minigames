name: Factory nightly
# The question factory's nightly upkeep: roll raw answers and plays up into per-question
# stats (rollup_answers), enforce the 30-day answer retention below the roll-up watermark
# (prune_personal_data), compact and prune the journal (factory_cleanup), the doctor's signal
# scan (doctor_scan: quarantines or queues suspect questions, picks the Thursday audit; a
# quarantine dispatches a publish of the question games so it leaves play), then the watchdog
# (factory_health) posts ONE Slack message to #agent-backend only when something is off.
# All steps are idempotent; every command journals its run.
# Design: docs/superpowers/specs/2026-10-12-question-factory-design.md.
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC
  workflow_dispatch:
concurrency:
  group: factory-nightly
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-pipeline.txt
      - name: Roll up answers and plays
        working-directory: backend
        run: python manage.py rollup_answers
      - name: Prune personal data
        working-directory: backend
        run: python manage.py prune_personal_data
      - name: Cleanup
        working-directory: backend
        run: python manage.py factory_cleanup
      - name: Doctor signal scan
        id: doctor
        working-directory: backend
        run: python manage.py doctor_scan
      # A quarantined question must leave production: the same publish the Checker dispatches
      # (with maintenance). Only from the default branch, so a manual run on another branch
      # never publishes its data.
      - name: Publish the doctor's quarantines
        if: steps.doctor.outputs.quarantined != '0' && steps.doctor.outputs.quarantined != '' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-game-data.yml --ref "${{ github.ref_name }}" \
            -f games=career-path,who-are-ya,tictactoe,contexto,fan-favorites,who-would-win -f target=vercel -f dry_run=false
          echo "Doctor quarantined ${{ steps.doctor.outputs.quarantined }} question(s); publish dispatched." >> "$GITHUB_STEP_SUMMARY"
      - name: Health
        if: always()
        working-directory: backend
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python manage.py factory_health --slack > health.txt
          if [ -s health.txt ]; then
            cat health.txt
            node ../scripts/slack.mjs post-text backend - < health.txt
          else
            echo "Factory health: all clear"
          fi
